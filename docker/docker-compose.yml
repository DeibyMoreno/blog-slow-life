version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slowlife-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: slowlife_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d slowlife_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: slowlife-db-test
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: slowlife_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d slowlife_test']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: slowlife-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  pgdata:
