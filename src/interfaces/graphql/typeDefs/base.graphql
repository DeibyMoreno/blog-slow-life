enum AuthRole {
  ADMIN
  EDITOR
  VIEWER
}

directive @auth(roles: [AuthRole]) on FIELD_DEFINITION

scalar DateTime
scalar UUID
scalar Email

interface Node {
  id: UUID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Query {
  health: HealthResponse!
  _empty: String
}

type Mutation {
  _empty: String
}

type HealthResponse {
  status: String!
  timestamp: DateTime!
  version: String!
  uptime: Float!
}
