type Tag implements Node {
  id: UUID!
  name: String!
  slug: String!
  posts: [Post!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateTagInput {
  name: String!
}

extend type Query {
  tags: [Tag!]!
  tag(id: UUID): Tag
  tagBySlug(slug: String!): Tag
}

extend type Mutation {
  createTag(input: CreateTagInput!): Tag!
  deleteTag(id: UUID!): Boolean!
}
